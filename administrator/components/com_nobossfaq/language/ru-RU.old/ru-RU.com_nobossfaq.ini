COM_NOBOSSFAQ_FILTER_LINK_TAB="Фильтры по url"
COM_NOBOSSFAQ_FILTER_LINK_TAB_DESC="На этой вкладке объясняется, как создать два типа фильтров URL-адресов для часто задаваемых вопросов: <br> <b> 1 - Фильтр для вопроса</b>: загружает страницу, оставляя видимым отфильтрованный вопрос вместе с ответом. <br> <b> 2 - Фильтр по категории</b>: загружает страницу, отображающую только вопросы из отфильтрованной категории."
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_INTRO="Первый шаг:"
COM_NOBOSSFAQ_FILTER_LINK_FIRT_STEP_DESC="&bull; Для любого из фильтров первое, что вам нужно сделать, это получить URL-адрес страницы, на которую будет загружен FAQ. <br> &bull; Пример URL:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_INTRO="Создание фильтра для вопроса:"
COM_NOBOSSFAQ_FILTER_LINK_QUESTION_DESC="&bull; Вам просто нужно добавить следующую информацию в конце вашего URL-адреса:%s<br> &bull; Пример того, как URL-адрес будет выглядеть с фильтром:%s<br> &bull; При доступе к этому URL-адресу пользователь будет перенаправлен на месте страницы , где в настоящее время отображается FAQ, выделяя отфильтрованный вопрос."
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_INTRO="Создание фильтра категорий:"
COM_NOBOSSFAQ_FILTER_LINK_CATEGORY_DESC="&bull; Вам просто нужно добавить следующую информацию в конец вашего URL: %s<br> &nbsp;&nbsp;&nbsp; &bull; Обратите внимание, что <b>%s</b> - это идентификатор категории, которая связана с этим вопросом, который вы редактируете. <br> &bull; Пример того, как URL-адрес будет выглядеть с фильтром:%s<br> &bull; При доступе к этому URL-адресу пользователь будет перенаправлен в то место на странице, где отображается FAQ, и отфильтрованная категория появится в панель поиска. <br> &bull; <b> Важно: </b> для использования этого фильтра необходимо включить поиск по категориям в настройке макета часто задаваемых вопросов."
COM_NOBOSSFAQ_FILTER_LINK_NOT_SAVE=" <b> Внимание: </b> вам необходимо сначала сохранить запись для просмотра направлений."


