PLG_NOBOSSAUTOUPDATE_FIELD_NOBOSS_EXTENSIONS_ONLY_LABEL="Atualizar somente extensões da No Boss Extensions"
PLG_NOBOSSAUTOUPDATE_FIELD_NOBOSS_EXTENSIONS_ONLY_DESC="Informe se deseja atualizar somente extensões da No Boss Extensions. Caso selecione a opção 'Não', todas extensões Joomla instaladas no site serão atualizadas."
PLG_NOBOSSAUTOUPDATE_FIELD_SEND_USER_EMAIL_LABEL="Enviar notificação por e-mail"
PLG_NOBOSSAUTOUPDATE_FIELD_SEND_USER_EMAIL_DESC="Informe situações em que notificações devem ser enviadas por e-mail sobre as atualizações realizadas automaticamente."
PLG_NOBOSSAUTOUPDATE_FIELD_SEND_USER_EMAIL_OPT_ERROR="Somente em caso de erros"
PLG_NOBOSSAUTOUPDATE_FIELD_SEND_USER_EMAIL_OPT_EVER="Em casos de erro e de sucesso"
PLG_NOBOSSAUTOUPDATE_FIELD_SEND_USER_EMAIL_OPT_NOT="Somente erro crítico"
PLG_NOBOSSAUTOUPDATE_FIELD_USER_EMAIL_LABEL="E-mail"
PLG_NOBOSSAUTOUPDATE_FIELD_USER_EMAIL_DESC="Informe o email para o qual será enviado as informações sobre os updates. Caso nenhum seja informado, será usado o e-mail das configurações globais."
PLG_NOBOSSAUTOUPDATE_INTERVAL_VERIFY_LABEL="Intervalo de verificação de atualizações (minutos)"
PLG_NOBOSSAUTOUPDATE_INTERVAL_VERIFY_DESC="Informe o intervalo em minutos que será verificado se existem novas atualizações."
PLG_NOBOSSAUTOUPDATE_EXECUTION_METHOD_LABEL="Forma de execução"
PLG_NOBOSSAUTOUPDATE_EXECUTION_METHOD_DESC="Informe a forma de execução do auto update. <br/><br/>* Caso escolha a opção <b>Acesso ao administrator</b>, a atualização das extensões irá ocorrer quando algum usuário acessar a área administrativa do site, respeitando o intervalo de tempo definido no campo abaixo. <br/><br/>* Caso escolha a opção <b>Configuração de cronjob</b>, será exibido logo abaixo uma url que deverá ser configurada em um cronjob para ser executado no intervalo de tempo que desejar."
PLG_NOBOSSAUTOUPDATE_EXECUTION_METHOD_OPT_CRON="Configuração de cronjob"
PLG_NOBOSSAUTOUPDATE_EXECUTION_METHOD_OPT_ADMIN="Acesso ao administrator"
PLG_NOBOSSAUTOUPDATE_EXECUTION_URL_LABEL="Url de execução"
PLG_NOBOSSAUTOUPDATE_EXECUTION_URL_DESC="Url que executa a função de Auto Update"
PLG_NOBOSSAUTOUPDATE_EMAIL_ERROR_LIBRARY_SUBJECT="[%s] [autoupdate] A critical error has occurred that needs attention."
PLG_NOBOSSAUTOUPDATE_EMAIL_ERROR_LIBRARY_CONTENT="There was an error during the installation or update of No Boss Library, required for the operation of all No Boss Extensions. To solve the problem, follow the steps below: <br />  * Install the library on your Joomla site using the https://www.nobossextensions.com/en/installation/nobosslibrary/ link. <br /> * Notify No Boss support on the problem through the contact form https://www.nobossextensions.com/en/."
PLG_NOBOSSAUTOUPDATE_EMAIL_ERROR_SUBJECT="[%s] [autoupdate] %s extensions could not be updated"
PLG_NOBOSSAUTOUPDATE_EMAIL_ERROR_CONTENT="The autoupdate plugin was run on website %s and %s extensions had error updating. Check out the report for each extension below: <br /><br /> %s"
PLG_NOBOSSAUTOUPDATE_EMAIL_EVER_SUBJECT="[%s] [autoupdate] %s extensions were updated and %s extensions had update error"
PLG_NOBOSSAUTOUPDATE_EMAIL_EVER_CONTENT="The autoupdate plugin was run on the website %s and %s extensions were successfully updated and %s had an error updating. Check out the report for each extension below: <br /><br /> %s <br /> %s"