COM_RSSEO_GA_GENERAL_0="Visits"
COM_RSSEO_GA_GENERAL_0_DESC="Visits represent the number of individual sessions initiated by all the visitors to your site. If a user is inactive on your site for 30 minutes or more, any future activity will be attributed to a new session. Users that leave your site and return within 30 minutes will be counted as part of the original session."
COM_RSSEO_GA_GENERAL_1="Total users"
COM_RSSEO_GA_GENERAL_1_DESC="The number of distinct users who have logged at least one event, regardless of whether the site or app was in use when that event was logged."
COM_RSSEO_GA_GENERAL_2="New users"
COM_RSSEO_GA_GENERAL_2_DESC="The number of users who interacted with your site or launched your app for the first time (event triggered: first_open or first_visit)."
COM_RSSEO_GA_GENERAL_3="Pageviews"
COM_RSSEO_GA_GENERAL_3_DESC="A pageview is defined as a view of a page on your site that is being tracked by the Analytics tracking code. If a visitor hits reload after reaching the page, this will be counted as an additional pageview. If a user navigates to a different page and then returns to the original page, a second pageview will be recorded as well."
COM_RSSEO_GA_GENERAL_4="Average time on site"
COM_RSSEO_GA_GENERAL_4_DESC="The average duration visitor sessions represented in total seconds."
COM_RSSEO_GA_GENERAL_5="Bounce rate"
COM_RSSEO_GA_GENERAL_5_DESC="Bounce rate is the percentage of single-page visits (i.e. visits in which the person left your site from the entrance page). Bounce rate is a measure of visit quality and a high bounce rate generally indicates that site entrance (landing) pages aren't relevant to your visitors. You can minimize Bounce Rates by tailoring landing pages to each keyword and ad that you run. Landing pages should provide the information and services that were promised in the ad copy."
