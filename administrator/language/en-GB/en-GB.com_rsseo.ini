COM_RSSEO_GA_GENERAL_TOTALVISIORS_DESC="Visits represent the number of individual sessions initiated by all the visitors to your site. If a user is inactive on your site for 30 minutes or more, any future activity will be attributed to a new session. Users that leave your site and return within 30 minutes will be counted as part of the original session."
COM_RSSEO_GA_GENERAL_UNIQUEVISITS="Unique visitors"
COM_RSSEO_GA_GENERAL_UNIQUEVISITS_DESC="Unique Visitors represents the number of unduplicated (counted only once) visitors to your website over the course of a specified time period. A Unique Visitor is determined using cookies."
