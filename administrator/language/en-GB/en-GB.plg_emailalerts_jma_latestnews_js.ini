PLG_EMAILALERTS_JMA_LATESTNEWS_JS="JMailAlerts - Content - Latest Articles / News"
PLG_EMAILALERTS_JMA_LATESTNEWS_JS_XML_DESCRIPTION="This plugin shows latest news i.e. articles in JMailAlerts emails. <br/>Follow these steps- <br/>1. First of all publish this plugin. <br/>2. Then in plugin / admin parameters, select categories for which alerts are allowed, click on apply / save. <br/>3. Then in legacy / user parameters, select default categories for which user will be autosubscribed when you sync alerts, click on apply / save."
