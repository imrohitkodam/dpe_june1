RST_ACCOUNT_NAME="Account Name"
RST_ACCOUNT_NAME_DESC="This is the name of the account. It's only used to be identified internally."
RST_ACCOUNT_SERVER="Server Address"
RST_ACCOUNT_SERVER_DESC="This is your email server's address. For example, pop.gmail.com"
RST_ACCOUNT_PROTOCOL="Server Protocol"
RST_ACCOUNT_PROTOCOL_DESC="This is your email server's protocol. POP3 and IMAP are currently supported."
RST_ACCOUNT_PORT="Server Port"
RST_ACCOUNT_PORT_DESC="This is your email server's port. Default for POP3 is 110."
RST_ACCOUNT_SECURITY="Security method"
RST_ACCOUNT_SECURITY_DESC="Select the security model that your server is using."
RST_ACCOUNT_NONE="None"
RST_ACCOUNT_VALIDATE="Validate Server Certificate"
RST_ACCOUNT_VALIDATE_DESC="Validate the server's certificate. Set this to No if you're using self-signed certificates."
RST_ACCOUNT_USERNAME="Username"
RST_ACCOUNT_USERNAME_DESC="This is the username that you use to connect to your email server."
RST_ACCOUNT_PASSWORD="Password"
RST_ACCOUNT_PASSWORD_DESC="This is the password that you use to connect to your email server."
RST_ACCOUNT_CHECK_INTERVAL="Check Interval (minutes)"
RST_ACCOUNT_CHECK_INTERVAL_DESC="To avoid multiple connections that might be detected as flood by your email server, you need to set a time interval between connections. We recommend you use 5 minutes."
RST_ACCOUNT_ACCEPT="Accept New Tickets From"
RST_ACCOUNT_ACCEPT_DESC="Configure if you allow new tickets to be created by this plugin. If you set this to Nobody, no emails will be transformed in new tickets. Instead, only ticket replies will be parsed."
RST_ACCOUNT_ACCEPT_ALL_REPLIES="Accept Replies From All Emails"
RST_ACCOUNT_ACCEPT_ALL_REPLIES_DESC="By setting this to Yes all replies will be treated as coming from the original submitter's email address, even if the email address doesn't match."
RST_ACCOUNT_DEPARTMENTS="Assign New Tickets To"
RST_ACCOUNT_DEPARTMENTS_DESC="New tickets will be assigned to the following department."
RST_ACCOUNT_PRIORITIES="New Tickets Have This Priority"
RST_ACCOUNT_PRIORITIES_DESC="New tickets will be added with the following priority."
RST_ACCOUNT_BLACKLIST="Blocked email addresses (each on new line)"
RST_ACCOUNT_BLACKLIST_DESC="You can specify which email addresses should not be accepted. Each email should be specified on a new line. You can also use * as a wildcard eg. MAILER-DAEMON@*"
RST_ACCOUNT_TYPE="Triggering Type"
RST_ACCOUNT_TYPE_DESC="Select the triggering type. <br /> <strong>Automatic</strong> - the cron parsing functionality will run every time your site gets accessed. <br /> <strong>Manual</strong> - the cron parsing functionality will run only when you create a cron task. <br /> <strong>Both</strong> - the cron parsing functionality will inherit both Manual and Automatic options."
RST_ACCOUNT_TYPE_CRON_HOWTO="How do I create a server-side cron task when 'Triggering Type' is set to 'Manual'?"
RST_ACCOUNT_TYPE_AUTOMATIC="Automatic"
