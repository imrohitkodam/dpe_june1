PLG_SYSTEM_RSTICKETSPROCRON="System - RSTickets! Pro Cron Email Parser"
RST_CRON_DESC="RSTickets! Pro Cron Plugin allows you to connect to any POP3/IMAP mailbox and automatically create tickets from received emails. You can set the plugin's parameters from Components &gt; RSTickets! Pro &gt; Overview <font color='red'><strong>Make sure you publish the plugin.</strong></font>"